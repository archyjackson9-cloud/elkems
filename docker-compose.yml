# Deploy with Hostinger Docker Manager (compose from this repo).
# Set the variables below in the Docker Manager environment section (see .env.docker.example).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eldsolutions-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      APP_NAME: "${APP_NAME:-ELD Solutions Ltd}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Set APP_KEY (php artisan key:generate --show)}"
      APP_URL: "${APP_URL:?Set APP_URL, e.g. https://yourdomain.com}"
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-eldsolutions}"
      DB_USERNAME: "${DB_USERNAME:-eld}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_SCHEME: "${MAIL_SCHEME:-ssl}"
      MAIL_HOST: "${MAIL_HOST:-smtp.gmail.com}"
      MAIL_PORT: "${MAIL_PORT:-465}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-info@eldsolutions.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-ELD Solutions Ltd}"
      ADMIN_NAME: "${ADMIN_NAME:-ELD Admin}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@eldsolutions.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - eld

  db:
    image: mysql:8.0
    container_name: eldsolutions-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-eldsolutions}"
      MYSQL_USER: "${DB_USERNAME:-eld}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - eld

volumes:
  app_storage:
  db_data:

networks:
  eld:
